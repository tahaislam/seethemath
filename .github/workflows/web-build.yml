name: Web build

# Builds the static web export on every PR and on pushes to main, so a broken
# build (syntax error, bad import, failed static render) is caught before merge.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-web:
    name: expo export -p web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npx expo export -p web

      - name: Sanity-check the export
        run: |
          test -f dist/index.html
          # Every topic in the registry should produce a static page.
          ls dist/topic/*.html
          echo "Static web export OK."

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
